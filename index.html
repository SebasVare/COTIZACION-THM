<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cotizador Móvil</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    

    <!-- MENÚ SUPERIOR DE ARCHIVO -->
    <nav class="menu-archivo no-exportar">
        <button type="button" id="btn-menu-nuevo" class="btn-menu">📄 Nuevo</button>
        <button type="button" id="btn-menu-abrir" class="btn-menu">📂 Abrir Cotización</button>
        <button type="button" id="btn-menu-guardar" class="btn-menu btn-highlight">💾 Guardar</button>
    </nav>

    <div class="container" id="contenido-cotizacion">
        
        <!-- CABECERA DE LA COTIZACIÓN -->
        <header class="header-cotizacion">
            <img src="THM.png" alt="Logo de la Empresa" class="logo-empresa">
            <div>
                <h1 class="titulo-principal">Cotización</h1>
                <span id="lbl-folio" class="folio-badge">Folio: --</span>
            </div>
        </header>

        <!-- DATOS GENERALES -->
        <div class="form-group">
            <label for="cotizador">Quien Cotiza / Empresa:</label>
            <input type="text" id="cotizador" placeholder="Nombre de la empresa o cotizador">
        </div>

        <div class="form-group">
            <label for="cliente">Cliente / Destinatario:</label>
            <input type="text" id="cliente" placeholder="Nombre del cliente">
        </div>

        <div class="form-group">
            <label for="select-iva">¿Incluir IVA (16%)?</label>
            <select id="select-iva">
                <option value="si" selected>Sí, agregar IVA</option>
                <option value="no">No, sin IVA</option>
            </select>
        </div>

        <!-- SECCIÓN 1: MATERIAL -->
        <section class="articulo-seccion no-exportar">
            <h3>1. Material</h3>
            <div class="grid-inputs">
                <div class="form-group">
                    <label for="grosorMaterial">Grosor:</label>
                    <select id="grosorMaterial">
                        <option value="15mm">15 mm</option>
                        <option value="6mm">6 mm</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="marcaMaterial">Tipo / Marca:</label>
                    <select id="marcaMaterial">
                        <option value="ARAUCO">ARAUCO</option>
                        <option value="VESTO">VESTO</option>
                        <option value="MEL">MEL</option>
                        <option value="MINA">MINA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cantidadMaterial">Cantidad:</label>
                    <input type="number" id="cantidadMaterial" min="1" value="1">
                </div>
                <div class="form-group">
                    <label for="precioMaterial">Precio Unitario ($):</label>
                    <input type="number" id="precioMaterial" min="0" step="0.01" placeholder="0.00">
                </div>
            </div>
            <button type="button" id="btn-agregar-material" class="btn-secondary">➕ Agregar Material</button>
        </section>

        <!-- SECCIÓN 2: HERRAJES -->
        <section class="articulo-seccion no-exportar">
            <h3>2. Herrajes</h3>
            <div class="grid-inputs">
                <div class="form-group span-2">
                    <label for="tipoHerraje">Tipo de Herraje:</label>
                    <select id="tipoHerraje">
                        <option value="Bisagras cierre suave">Bisagras cierre suave</option>
                        <option value="Bisagras cierre normal">Bisagras cierre normal</option>
                        <option value="Bisagras cierre libre">Bisagras cierre libre</option>
                        <option value="Tubo ovalado">Tubo ovalado</option>
                        <option value="Tubo ovalado LED">Tubo ovalado LED</option>
                        <option value="Perfil LED">Perfil LED</option>
                        <option value="Perfil LED con pestaña">Perfil LED con pestaña</option>
                        <option value="Correderas de 300mm">Correderas de 300mm</option>
                        <option value="Correderas de 350mm">Correderas de 350mm</option>
                        <option value="Correderas de 400mm">Correderas de 400mm</option>
                        <option value="Correderas de 450mm">Correderas de 450mm</option>
                        <option value="Correderas de 500mm">Correderas de 500mm</option>
                        <option value="Bisagras de libro">Bisagras de libro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cantidadHerraje">Cantidad:</label>
                    <input type="number" id="cantidadHerraje" min="1" value="1">
                </div>
                <div class="form-group">
                    <label for="precioHerraje">Precio Unitario ($):</label>
                    <input type="number" id="precioHerraje" min="0" step="0.01" placeholder="0.00">
                </div>
            </div>
            <button type="button" id="btn-agregar-herraje" class="btn-secondary">➕ Agregar Herraje</button>
        </section>

        <!-- SECCIÓN 3: LUMINARIA -->
        <section class="articulo-seccion no-exportar">
            <h3>3. Luminaria</h3>
            <div class="grid-inputs">
                <div class="form-group span-2">
                    <label for="tipoLuminaria">Tipo de Elemento:</label>
                    <select id="tipoLuminaria">
                        <option value="Cable LED">Cable LED</option>
                        <option value="Cable calibre 16">Cable calibre 16</option>
                        <option value="Transformador">Transformador</option>
                        <option value="Botón">Botón</option>
                        <option value="LED">LED</option>
                        <option value="Contactos">Contactos</option>
                        <option value="Apagadores">Apagadores</option>
                        <option value="Chalupa de sobreponer">Chalupa de sobreponer</option>
                        <option value="Pasacables">Pasacables</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cantidadLuminaria">Cantidad:</label>
                    <input type="number" id="cantidadLuminaria" min="1" value="1">
                </div>
                <div class="form-group">
                    <label for="precioLuminaria">Precio Unitario ($):</label>
                    <input type="number" id="precioLuminaria" min="0" step="0.01" placeholder="0.00">
                </div>
            </div>
            <button type="button" id="btn-agregar-luminaria" class="btn-secondary">➕ Agregar Luminaria</button>
        </section>

        <!-- TABLA DE DETALLE Y TOTALES -->
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Concepto</th>
                        <th>Cant.</th>
                        <th>P.U.</th>
                        <th>Subtotal</th>
                        <th class="no-exportar"></th>
                    </tr>
                </thead>
                <tbody id="tbody-articulos">
                    <tr><td colspan="5" style="text-align: center; color: #718096;">No hay artículos agregados</td></tr>
                </tbody>
            </table>
        </div>

        <div class="totales-contenedor">
            <p>Subtotal: <strong id="lbl-subtotal">$0.00</strong></p>
            <p id="box-iva">IVA (16%): <strong id="lbl-iva">$0.00</strong></p>
            <p class="total-destacado">Total: <strong id="lbl-total">$0.00</strong></p>
        </div>

    </div>

    <!-- VENTANA MODAL PARA ABRIR GUARDADOS DENTRO DE LA APP -->
    <div id="modal-lista" class="modal-backdrop no-exportar">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>Mis Cotizaciones Guardadas</h2>
                <button type="button" id="btn-cerrar-modal" class="btn-cerrar">&times;</button>
            </div>
            <div id="contenedor-lista-guardados" class="lista-cotizaciones">
                <!-- Se llena de forma dinámica desde JS -->
            </div>
        </div>
    </div>

    <!-- BARRA FLOTANTE MÓVIL PARA EXPORTAR -->
    <div class="barra-acciones-movil no-exportar">
        <button type="button" id="btn-pdf" class="btn-pdf">📄 Imprimir / PDF</button>
        <button type="button" id="btn-excel" class="btn-excel">📥 Descargar Excel</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
