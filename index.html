<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cotizador THM</title>
    
    <!-- PWA Config/Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="icon" type="image/png" href="THM.png">

    <!-- Estilos de la Aplicación -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado Principal -->
    <header class="app-header">
        <div class="brand">
            <img src="THM.png" alt="Logo THM" class="logo-app">
            <h1>Cotizador THM</h1>
        </div>
        <div class="menu-archivo">
            <button id="btn-menu-nuevo" class="btn-menu">📄 Nuevo</button>
            <button id="btn-menu-guardar" class="btn-menu">💾 Guardar</button>
            <button id="btn-menu-abrir" class="btn-menu">📂 Abrir</button>
        </div>
    </header>

    <main class="container">
        <!-- Tarjeta de Datos Generales -->
        <section class="card">
            <h2>Datos Generales</h2>
            <div class="grid-form">
                <div class="form-group">
                    <label for="input-cotizador">Cotizador / Vendedor:</label>
                    <input type="text" id="input-cotizador" placeholder="Nombre de quien cotiza">
                </div>
                <div class="form-group">
                    <label for="input-cliente">Cliente:</label>
                    <input type="text" id="input-cliente" placeholder="Nombre del cliente o proyecto">
                </div>
                <div class="form-group">
                    <label for="select-iva">Incluir IVA (16%):</label>
                    <select id="select-iva">
                        <option value="si" selected>Sí</option>
                        <option value="no">No</option>
                    </select>
                </div>
                <div class="form-group folio-box">
                    <span id="lbl-folio">Folio: Carga...</span>
                </div>
            </div>
        </section>

        <!-- Formulario para Agregar Artículos -->
        <section class="card">
            <h2>Agregar Artículo</h2>
            <form id="form-articulo" class="grid-form">
                <div class="form-group full-width">
                    <label for="input-concepto">Concepto / Descripción del Mueble:</label>
                    <input type="text" id="input-concepto" placeholder="Ej. Cocina integral de melamina blanca" required>
                </div>

                <!-- Sección: Melamina / Tableros -->
                <div class="form-group">
                    <label for="select-material">Material / Melamina:</label>
                    <select id="select-material">
                        <option value="">-- Seleccionar --</option>
                        <option value="Melamina Blanca 15mm">Melamina Blanca 15mm</option>
                        <option value="Melamina Color/Diseño 15mm">Melamina Color/Diseño 15mm</option>
                        <option value="MDF 15mm Tapa">MDF 15mm Tapa</option>
                        <option value="Enchapado Encino">Enchapado Encino</option>
                    </select>
                </div>

                <!-- Sección: Herrajes -->
                <div class="form-group">
                    <label for="select-herraje">Herrajes:</label>
                    <select id="select-herraje">
                        <option value="">-- Seleccionar --</option>
                        <option value="Bisagra Cierre Lento">Bisagra Cierre Lento</option>
                        <option value="Corredera Extensión 45cm">Corredera Extensión 45cm</option>
                        <option value="Corredera Oculta Cierre Lento">Corredera Oculta Cierre Lento</option>
                        <option value="Jaladera Perfil Aluminio">Jaladera Perfil Aluminio</option>
                    </select>
                </div>

                <!-- Sección: Luminarias / Iluminación -->
                <div class="form-group">
                    <label for="select-luminaria">Luminarias / Perfiles LED:</label>
                    <select id="select-luminaria">
                        <option value="">-- Seleccionar --</option>
                        <option value="Tira LED Cálida + Canal Aluminio">Tira LED Cálida + Canal</option>
                        <option value="Tira LED Neutra + Canal Aluminio">Tira LED Neutra + Canal</option>
                        <option value="Sensor de Presencia">Sensor de Presencia</option>
                        <option value="Transformador / Fuente 12V">Transformador 12V</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="input-cantidad">Cantidad:</label>
                    <input type="number" id="input-cantidad" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="input-precio">Precio Unitario ($):</label>
                    <input type="number" id="input-precio" min="0" step="0.01" placeholder="0.00" required>
                </div>

                <div class="form-group full-width">
                    <button type="submit" id="btn-agregar" class="btn-primario">➕ Agregar Artículo</button>
                </div>
            </form>
        </section>

        <!-- Tabla de Artículos Cotizados -->
        <section class="card">
            <h2>Resumen de Cotización</h2>
            <div class="table-responsive">
                <table id="tabla-cotizacion">
                    <thead>
                        <tr>
                            <th>Cant.</th>
                            <th>Concepto / Detalles</th>
                            <th>P. Unitario</th>
                            <th>Subtotal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-articulos">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>

            <!-- Totales -->
            <div class="resumen-totales">
                <div class="fila-total">
                    <span>Subtotal:</span>
                    <strong id="lbl-subtotal">$0.00</strong>
                </div>
                <div class="fila-total" id="box-iva">
                    <span>IVA (16%):</span>
                    <strong id="lbl-iva">$0.00</strong>
                </div>
                <div class="fila-total gran-total">
                    <span>Total:</span>
                    <strong id="lbl-total">$0.00</strong>
                </div>
            </div>

            <!-- Botones de Exportación -->
            <div class="acciones-exportar">
                <button id="btn-exportar-pdf" class="btn-exito">📄 Exportar PDF</button>
                <button id="btn-exportar-excel" class="btn-secundario">📊 Exportar Excel</button>
            </div>
        </section>
    </main>

    <!-- Modal Interno para Abrir y Visualizar Cotizaciones Guardadas -->
    <div id="modal-cotizaciones" class="modal-overlay" style="display: none;">
        <div class="modal-contenido">
            <div class="modal-header">
                <h3>📂 Cotizaciones Guardadas en el Celular</h3>
                <button id="btn-cerrar-modal" class="btn-cerrar">&times;</button>
            </div>
            <div class="modal-body">
                <div id="lista-cotizaciones-guardadas" class="lista-borradores">
                    <!-- Se llena automáticamente con JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Script de la Aplicación -->
    <script src="script.js"></script>
</body>
</html>
